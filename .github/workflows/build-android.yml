name: Build Aakar Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'mobile/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:
    inputs:
      version:
        description: "Override version (blank = read it from app/index.html)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/package.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Pre-flight
        run: |
          test -f app/index.html || { echo "::error::app/index.html missing"; exit 1; }
          test -f mobile/prepare.js || { echo "::error::mobile/prepare.js missing"; exit 1; }

      - name: Install Capacitor
        working-directory: mobile
        run: |
          for i in 1 2 3; do npm install --no-audit --no-fund && break; echo "retry $i"; sleep $((i*15)); done

      # services.gradle.org often times out from GitHub runners (the wrapper only waits 10 s). Download Gradle ourselves with retries + mirrors, cache it, and point the wrapper at the file.
      - name: Cache Gradle distribution
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/gradle-8.2.1-bin.zip
          key: gradle-dist-8.2.1

      - name: Download Gradle 8.2.1 (retry + mirrors)
        run: |
          Z="$RUNNER_TEMP/gradle-8.2.1-bin.zip"
          if [ -s "$Z" ] && unzip -tq "$Z" >/dev/null 2>&1; then echo "cached"; else
            rm -f "$Z"
            for u in https://services.gradle.org/distributions/gradle-8.2.1-bin.zip \
                     https://downloads.gradle.org/distributions/gradle-8.2.1-bin.zip \
                     https://mirrors.cloud.tencent.com/gradle/gradle-8.2.1-bin.zip \
                     https://mirrors.aliyun.com/gradle/gradle-8.2.1-bin.zip; do
              for i in 1 2 3; do
                echo "try $i: $u"
                curl -fL --connect-timeout 30 --max-time 600 --retry 3 --retry-all-errors -o "$Z" "$u" && unzip -tq "$Z" >/dev/null 2>&1 && break 2
                rm -f "$Z"; sleep $((i*10))
              done
            done
          fi
          test -s "$Z" || { echo "::error::could not download Gradle from any source. Re-run the job."; exit 1; }
          echo "GRADLE_ZIP=$Z" >> "$GITHUB_ENV"

      - name: Generate the Android project from app/index.html
        working-directory: mobile
        env:
          APP_VERSION: ${{ github.event.inputs.version }}
          VERSION_CODE: ${{ github.run_number }}
        run: node prepare.js

      - name: Build debug APK (installs on any device)
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          for i in 1 2 3; do ./gradlew --no-daemon --stacktrace assembleDebug && ok=1 && break; echo "gradle failed (try $i; usually a download timeout)"; sleep $((i*30)); done
          [ "${ok:-0}" = "1" ] || exit 1

      # Optional: a signed release APK when you add these repository secrets:
      # ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      - name: Build signed release APK
        if: env.HAS_KS == 'true'
        working-directory: mobile/android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/aakar.jks"
          ./gradlew --no-daemon assembleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/aakar.jks" \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"

      - name: Collect APKs
        run: |
          mkdir -p out
          find mobile/android/app/build/outputs/apk -name "*.apk" -exec cp {} out/ \;
          ls -la out
          test -n "$(ls out/*.apk 2>/dev/null)" || { echo "::error::no APK produced"; exit 1; }

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Aakar-android-apk
          path: out/*.apk
          if-no-files-found: error
