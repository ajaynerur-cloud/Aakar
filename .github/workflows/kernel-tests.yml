name: AakarKernel tests

on:
  push:
    paths: [ 'kernel/**', 'app/index.html' ]
  pull_request:
    paths: [ 'kernel/**', 'app/index.html' ]
  workflow_dispatch:

jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test helpers (triangulator for rim fillets, real OpenCascade for the fallback tests)
        run: npm i --no-save --ignore-scripts earcut@2.2.4 occt-wasm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Real OpenCascade (Python) to cross-check freeform STEP files
        run: pip install cadquery-ocp
      - name: Kernel + integration tests (uses the real app/index.html)
        run: node kernel/test/run-all.js app/index.html
      - name: Freeform STEP files read by a real OpenCascade
        run: python3 kernel/test/occt_crosscheck.py
      - name: Kernel in the html matches kernel/src
        run: |
          cp app/index.html /tmp/index.check.html
          node kernel/sync.js /tmp/index.check.html
          cmp app/index.html /tmp/index.check.html || { echo "::error::app/index.html embeds a different kernel than kernel/src - run: node kernel/sync.js app/index.html"; exit 1; }
      - name: Build the installable kernel
        run: node kernel/build.js
      - name: Upload installable kernel
        uses: actions/upload-artifact@v4
        with:
          name: AakarKernel-installable
          path: kernel/dist/aakar-kernel.installable.js
