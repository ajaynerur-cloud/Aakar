name: Build Aakar Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: "App version (e.g. 8.62.0). Leave blank to use package.json version."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash          # avoids PowerShell splitting "-c.extraMetadata..." args

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pre-flight checks
        run: |
          set -e
          for f in package.json main.js preload.js app/index.html; do
            if [ ! -f "$f" ]; then echo "::error::Missing required file: $f"; exit 1; fi
          done
          for f in prompt.html prompt-preload.js build/icon.ico; do
            if [ ! -f "$f" ]; then echo "::warning::Optional file not found: $f"; fi
          done
          if grep -q "Aakar_8.15.0.html" main.js; then
            echo "::error::main.js still points to app/Aakar_8.15.0.html (deleted). Change it to app/index.html"; exit 1
          fi

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Set version
        run: |
          VER="${{ github.event.inputs.version }}"
          if [ -n "$VER" ]; then
            npm version "$VER" --no-git-tag-version --allow-same-version
          fi
          echo "APP_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Remove icon settings if icon missing
        run: |
          if [ ! -f build/icon.ico ]; then
            node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));delete p.build.win.icon;delete p.build.nsis.installerIcon;delete p.build.nsis.uninstallerIcon;fs.writeFileSync('package.json',JSON.stringify(p,null,2));"
            echo "Icon not found - building with default Electron icon"
          fi

      - name: Build installer and portable EXE
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win nsis portable --x64 --publish never

      - name: List output
        run: ls -la dist

      - name: Upload EXEs
        uses: actions/upload-artifact@v4
        with:
          name: Aakar-${{ env.APP_VERSION }}-windows
          path: |
            dist/*.exe
          if-no-files-found: error
