name: Build Aakar Windows EXE

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # installs electron, electron-builder and occt-wasm (pinned in package.json / package-lock.json)
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Package tests (asset protocol, kernel binding, self-test gate)
        run: npm test

      # OpenCascade (occt-wasm) is copied into app/occt as plain files and loaded at run time by app/occt/aakar-occt.mjs.
      # It is NOT bundled (no esbuild): bundling is what broke it before. The committed binding files are never deleted.
      - name: OpenCascade - copy runtime and self-test
        id: occt
        continue-on-error: true
        shell: bash
        run: |
          # occt-wasm is pinned in package.json; install it here too in case an older package.json is checked out
          test -d node_modules/occt-wasm || npm install --no-save --no-audit --no-fund occt-wasm@5.7.1
          # app/occt holds ES modules: tell Node 20 so the self-test can load them
          test -f app/occt/package.json || echo '{ "type": "module" }' > app/occt/package.json
          node scripts/fetch-occt-wasm.js
          node tools/occt-selftest.mjs app/occt/aakar-occt.mjs

      - name: OpenCascade - leave it out if it did not pass
        if: steps.occt.outcome != 'success'
        shell: bash
        run: |
          echo "::warning title=OpenCascade not packaged::occt-wasm did not pass its self-test - see the step above. The EXE uses AakarKernel only."
          find app/occt -type f ! -name 'aakar-occt.mjs' ! -name 'aakar-occt.js' ! -name 'README.md' ! -name 'package.json' -delete

      - name: OpenCascade - check what is packaged
        shell: bash
        run: |
          ls -la app/occt
          if [ "${{ steps.occt.outcome }}" = "success" ]; then
            test -f app/occt/index.js && test -f app/occt/occt-wasm.js && test -f app/occt/occt-wasm.wasm
            echo "::notice title=OpenCascade packaged::occt-wasm $(node -p "require('./app/occt/occt-wasm-manifest.json').version") ($(node -p "require('./app/occt/occt-wasm-manifest.json').wasmMB") MB) is in the EXE."
          fi

      - name: Build installer and portable EXE
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload EXE files
        uses: actions/upload-artifact@v4
        with:
          name: Aakar-windows
          path: |
            dist/*.exe
          if-no-files-found: error

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
