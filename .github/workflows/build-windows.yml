name: Build Aakar Windows EXE

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'mobile/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:
    inputs:
      version:
        description: "Override version (leave blank to read it from app/index.html)"
        required: false
        default: ""

permissions:
  contents: read

env:
  DEBUG: electron-builder   # prints the real error line that the one-line 'CANNOT_EXECUTE' hides
  # keep the big downloads (Electron, NSIS, winCodeSign) in folders we can cache between runs
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

jobs:
  build-windows:
    runs-on: windows-2022   # windows-latest moved to Server 2025; 2022 is the image electron-builder is tested on
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: Pre-flight checks
        run: |
          set -e
          for f in package.json main.js preload.js app/index.html tools/read-version.js; do
            if [ ! -f "$f" ]; then echo "::error::Missing required file: $f"; exit 1; fi
          done
          for f in prompt.html prompt-preload.js build/icon.ico; do
            if [ ! -f "$f" ]; then echo "::warning::Optional file not found: $f"; fi
          done
          if grep -q "Aakar_8.15.0.html" main.js; then
            echo "::error::main.js still points to app/Aakar_8.15.0.html. Change it to app/index.html"; exit 1
          fi

      # The Electron binary comes from github.com/electron/electron/releases. When GitHub answers
      # "504 Gateway Time-out" the old one-shot install failed the whole build. Now: install the JS
      # packages without running the download, then fetch the binary with retries and a mirror fallback.
      - name: Install dependencies (npm packages)
        run: |
          set -e
          for i in 1 2 3 4; do
            if [ -f package-lock.json ]; then npm ci --ignore-scripts && break; else npm install --ignore-scripts && break; fi
            echo "npm install failed (try $i), waiting..."; sleep $((i*20))
          done

      - name: Download Electron binary (retry + mirror fallback)
        run: |
          set -e
          ok=0
          for i in 1 2 3 4 5 6; do
            if [ "$i" -ge 4 ]; then
              export ELECTRON_MIRROR="https://npmmirror.com/mirrors/electron/"
              echo "try $i via mirror $ELECTRON_MIRROR"
            else
              unset ELECTRON_MIRROR
              echo "try $i via github.com"
            fi
            if node node_modules/electron/install.js; then ok=1; break; fi
            echo "Electron download failed (try $i), waiting..."; sleep $((i*25))
          done
          if [ "$ok" != "1" ]; then echo "::error::Could not download Electron after 6 tries (GitHub and mirror). Re-run the workflow."; exit 1; fi
          ls node_modules/electron/dist | head -5

      - name: Set version from app/index.html
        run: |
          set -e
          VER="${{ github.event.inputs.version }}"
          if [ -n "$VER" ]; then
            npm version "$VER" --no-git-tag-version --allow-same-version
            echo "APP_VERSION=$VER" >> "$GITHUB_ENV"
            echo "Using manual override: $VER"
          else
            node tools/read-version.js app/index.html
          fi
          echo "package.json version is now: $(node -p "require('./package.json').version")"

      - name: Remove icon settings if icon missing
        run: |
          if [ ! -f build/icon.ico ]; then
            node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));delete p.build.win.icon;delete p.build.nsis.installerIcon;delete p.build.nsis.uninstallerIcon;fs.writeFileSync('package.json',JSON.stringify(p,null,2));"
            echo "Icon not found - building with default Electron icon"
          fi

      # app-builder.exe (a Go helper inside electron-builder) crashed with "ERR_ELECTRON_BUILDER_CANNOT_EXECUTE".
      # In the portable target it is only used to make a random folder name (ksuid): we give a fixed name instead.
      # In the installer target it is only used for the update blockmap: switched off (nothing here auto-updates).
      - name: Make the build independent of app-builder extras
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));p.build.portable=Object.assign({},p.build.portable,{unpackDirName:'Aakar-'+p.version});p.build.nsis=Object.assign({},p.build.nsis,{differentialPackage:false});fs.writeFileSync('package.json',JSON.stringify(p,null,2));console.log('portable.unpackDirName =',p.build.portable.unpackDirName)"

      - name: Build EXE (installer + portable, with fallbacks)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          have() { ls dist/*.exe >/dev/null 2>&1; }
          build() { npx electron-builder --win "$@" --x64 --publish never; }
          for i in 1 2; do
            if build nsis portable; then break; fi
            echo "::warning::electron-builder (nsis + portable) failed, try $i"; sleep 20
          done
          if ! have; then
            echo "::warning::combined build failed - trying each target alone"
            build portable || echo "::warning::portable target failed"
            build nsis || echo "::warning::nsis target failed"
          fi
          if ! have; then
            echo "::warning::no EXE produced - packing an unpacked folder and zipping it (runs without install)"
            rm -rf dist/win-unpacked
            if build dir; then :; else
              npx --yes @electron/packager . Aakar --platform=win32 --arch=x64 --out=dist-pack --overwrite --asar --electron-version=33.4.11 \
                --ignore="^/(dist|dist-pack|\.github|\.cache|kernel|docs|tests?|patches|examples|files|tools|Py Patch|Aakar_Tutorials)(/|$)"
              mkdir -p dist && mv dist-pack/Aakar-win32-x64 dist/win-unpacked
            fi
            powershell -NoProfile -Command "Compress-Archive -Path 'dist/win-unpacked/*' -DestinationPath 'dist/Aakar-${APP_VERSION}-win-x64.zip' -Force"
          fi
          ls -la dist

      - name: Verify output
        run: |
          shopt -s nullglob
          files=(dist/*.exe dist/*.zip)
          if [ ${#files[@]} -eq 0 ]; then echo "::error::nothing was produced in dist/"; exit 1; fi
          ls -la "${files[@]}"

      - name: Upload EXEs
        uses: actions/upload-artifact@v4
        with:
          name: Aakar-${{ env.APP_VERSION }}-windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error
