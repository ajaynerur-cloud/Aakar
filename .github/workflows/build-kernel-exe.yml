name: AakarKernel.exe

on:
  workflow_dispatch:
  push:
    tags: [ 'kernel-v*' ]

jobs:
  exe:
    runs-on: windows-2022
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Pack kernel/cli.js into AakarKernel.exe
        run: |
          set -e
          npx --yes @yao-pkg/pkg@5.16.1 kernel/cli.js --targets node20-win-x64 --output AakarKernel.exe
          ./AakarKernel.exe --selftest
      - uses: actions/upload-artifact@v4
        with: { name: AakarKernel-exe, path: AakarKernel.exe }
